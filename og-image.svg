  <g transform="translate(160 0)"><rect width="145" height="74" rx="22" fill="#fff" stroke="#cfe4d3" stroke-width="2"/><circle cx="36" cy="37" r="24" fill="#7abf82"/><circle cx="36" cy="30" r="8" fill="white"/><path d="M24 52 q12-18 24 0" fill="white"/><text x="98" y="44" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="800" fill="#4e9a5a">登録不要</text></g>
