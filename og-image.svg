  <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#6f4c4c" flood-opacity=".14"/></filter>
</defs>
<rect width="1200" height="630" rx="30" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="598" rx="24" fill="none" stroke="#f6c6c8" stroke-width="4"/>

